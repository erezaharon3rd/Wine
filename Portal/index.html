<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F3F3F2">
<title>Grape Arts · המערכת המלאה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F3F2;--surface:#FFFFFF;--ink:#171717;--muted:#575755;--line:#DCDCDA;--soft:#6F6F6D;
--display:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
--body:"IBM Plex Sans Hebrew","Heebo","Arial Hebrew",Arial,sans-serif;
--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#E8E8E6;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{position:sticky;top:0;z-index:8;min-height:56px;display:flex;align-items:center;gap:6px;padding:env(safe-area-inset-top) 12px 0 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.top .brand{font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:-.01em;line-height:1.2}
.top .rl{font-size:13px;color:var(--soft)}
.top .sp{flex:1}
.ib{position:relative;width:44px;height:44px;border:0;background:none;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.ib svg{width:22px;height:22px}
.ib .dot{position:absolute;top:4px;left:2px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:11px;line-height:18px;font-family:var(--mono);border:2px solid var(--bg)}
.av{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:500;flex:none}
.demobadge{display:inline-block;font-size:11.5px;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:0 7px;margin-inline-start:6px;vertical-align:2px;font-family:var(--body)}
.ph,.th{background-color:#E6E6E4}
.hasbar .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
.reorder{display:flex;flex-direction:column;gap:2px}
.reorder button{width:36px;height:30px;border:1px solid var(--line);background:var(--surface);cursor:pointer;border-radius:2px;font-size:13px}
.reorder button:disabled{opacity:.3}
details.more{margin-top:8px}details.more summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:36px;display:flex;align-items:center}

main{flex:1;padding:18px 20px 120px}
h1{font-family:var(--display);font-weight:500;font-size:32px;line-height:1.1;letter-spacing:-.01em;margin:6px 0 8px;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.2;margin:0 0 6px}
h3{font-size:13.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;margin:26px 0 10px}
.lead{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 18px}
.eyebrow{font-size:13px;color:var(--soft)}
.back{background:none;border:0;padding:10px 0;min-height:44px;color:var(--muted);font-size:15px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:9;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;background:none;border:0;padding:6px 2px;min-height:56px;font-size:13px;color:var(--soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:2px}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabbar button[aria-current="page"] svg{stroke-width:2}
.tabbar .bd{position:absolute;margin:-2px -18px 0 0;min-width:16px;height:16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:10.5px;line-height:16px;font-family:var(--mono);padding:0 4px}
.tabbar span.w{position:relative;display:grid;place-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:2px;padding:12px 18px;min-height:48px;font-weight:500;letter-spacing:.01em;cursor:pointer;text-align:center;font-size:15.5px}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line);font-weight:400}
.btn.wide{display:flex;width:100%}
.btn.sm{padding:8px 14px;min-height:44px;font-size:14.5px}
.btn.danger{background:transparent;color:#8A1F11;border-color:#E3C2BC}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.row .btn{flex:1}
.link{background:none;border:0;padding:10px 0;min-height:44px;color:var(--muted);text-decoration:underline;font-size:14.5px;cursor:pointer}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:16px}
.panel+.panel{margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);padding:12px 10px;text-align:start;border-radius:2px}
button.kpi{cursor:pointer}
.kpi b{display:block;font-family:var(--mono);font-weight:400;font-size:19px;direction:ltr;text-align:right}
.kpi span{font-size:13px;color:var(--muted);line-height:1.35;display:block}

.list{display:grid;gap:8px}
.li{display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:10px 12px;text-align:start;cursor:pointer;min-height:56px}
div.li{cursor:default}
.li .th{width:52px;height:64px;flex:none;background:var(--line) center/cover;border-radius:1px}
.li .th.sq{height:52px}
.li .mt{flex:1;min-width:0}
.li .mt b{display:block;font-weight:500;font-size:15px;line-height:1.35}
.li .mt small{display:block;color:var(--muted);font-size:13.5px;line-height:1.4;margin-top:2px}
.li .end{font-size:13.5px;color:var(--muted);text-align:end;flex:none}
.pill{display:inline-block;font-size:13px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.on{border-color:var(--ink);color:var(--ink)}
.pill.solid{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.unread{border-inline-start:3px solid var(--ink)}

.next{background:var(--surface);border:1px solid var(--ink);border-radius:2px;padding:14px 16px;margin-bottom:10px}
.next .who{font-size:13px;color:var(--soft)}
.next b{display:block;font-size:16px;font-weight:600;margin:2px 0 4px}
.next p{margin:0 0 10px;color:var(--muted);font-size:14px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:2px;overflow:hidden;padding:0;text-align:start;cursor:pointer;display:block;width:100%}
.tile .ph{display:block;width:100%;aspect-ratio:4/5;background:var(--bg) center/cover;border-bottom:1px solid var(--line)}
.tile .ph.bot{background:linear-gradient(#EFEFED,#E6E6E4);display:grid;place-items:center}
.tile .ph.bot svg{height:92%;width:auto}
.tile .cp{display:block;padding:8px 10px 10px;font-size:14.5px;line-height:1.35}
.tile .cp small{display:block;color:var(--muted);font-size:13px}
.tile .cp .pr{display:block;font-family:var(--mono);font-size:13px;margin-top:3px;direction:ltr;text-align:right}
.tile .tag{position:absolute;top:8px;right:8px;font-size:12.5px;padding:2px 8px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:999px;color:var(--ink)}
.tile .tag.dk{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile .code{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:12.5px;padding:2px 8px;background:var(--ink);color:var(--bg);border-radius:999px}
.tile.off .ph{opacity:.45}

.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:4px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 0 10px;min-height:44px;font-size:15px;color:var(--soft);cursor:pointer;flex:none}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);border-radius:2px;padding:9px 13px;min-height:44px;font-size:14.5px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:500}
.chip[aria-pressed="true"]::before{content:"✓";font-size:12px}
.chip:disabled{opacity:.35;cursor:default}
.chip small{color:var(--soft);font-size:12.5px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:0 12px;margin-bottom:12px}
.search input{flex:1;border:0;background:none;padding:12px 0;outline:none;min-height:46px}
.search svg{width:18px;height:18px;color:var(--soft)}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 12px;padding:0 20px}
.hscroll .chip{flex:none}

.fld{display:grid;gap:5px;margin-top:14px}
.fld label{font-size:14px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:11px 12px;min-height:46px}
.fld textarea{min-height:84px;resize:vertical}
.fld small{color:var(--muted);font-size:13px}
.fld .err{color:#8A1F11;font-size:13px}
.fld.bad input{border-color:#8A1F11}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.sw:first-child{border-top:0}
.sw small{display:block;color:var(--muted);font-size:13.5px}
.tg{position:relative;width:48px;height:28px;flex:none;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;padding:0}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--soft);transition:right .15s}
.tg[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.tg[aria-checked="true"]::after{right:23px;background:var(--bg)}
.tg:disabled{opacity:.35}
input[type=range]{width:100%;accent-color:var(--ink);min-height:36px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin-top:14px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ink);flex:none;margin-top:1px}

dl{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:8px 10px;margin:0;font-size:15px}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere}
dl .m{font-family:var(--mono);direction:ltr;text-align:right}
dl .tot{font-weight:600;color:var(--ink)}
dl .sep{grid-column:1/-1;height:1px;background:var(--line);margin:2px 0}

.stages{display:flex;gap:4px;margin:12px 0 6px}
.stages i{flex:1;height:3px;background:var(--line);border-radius:2px}
.stages i.done{background:var(--ink)}
.stnow{font-size:14px;color:var(--muted)}
.stnow b{color:var(--ink);font-weight:600}

.hero{display:grid;place-items:center;background:linear-gradient(#EFEFED,#E4E4E2);border:1px solid var(--line);padding:14px 0;margin:12px 0 4px;position:relative;cursor:zoom-in;width:100%}
.hero svg{height:250px;width:auto}
.hero .wm{position:absolute;bottom:8px;left:10px;font-size:12.5px;color:var(--muted)}
.hero .zm{position:absolute;bottom:8px;right:10px;font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.9);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.paint{display:block;width:100%;border:1px solid var(--line);background:var(--bg);cursor:zoom-in}

.chat{display:grid;gap:8px;margin-top:6px}
.msg{max-width:84%;padding:9px 12px;background:var(--surface);border:1px solid var(--line);font-size:15px;line-height:1.45}
.msg small{display:block;font-size:12.5px;color:var(--soft);margin-bottom:2px}
.msg.me{justify-self:start;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg.me small{color:#C9C9C7}
.msg.sys{justify-self:center;background:none;border:0;color:var(--soft);font-size:13px;padding:2px;text-align:center}
.send{display:flex;gap:8px;margin-top:10px}
.send input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:11px 12px;min-height:48px}

.actbar{position:fixed;bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom)) !important;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:8;background:var(--surface);border-top:1px solid var(--ink);padding:10px 16px;display:flex;gap:10px;align-items:center}
.actbar .t{flex:1;min-width:0;font-size:14px;line-height:1.35}
.actbar .t b{display:block;font-size:15px}
.actbar .t span{color:var(--muted)}
.withbar{padding-bottom:130px}

.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--ink)}
.bars i.lt{background:var(--line)}
.bars em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink);direction:ltr}

.empty{color:var(--soft);font-size:15px;padding:22px 8px;text-align:center;line-height:1.6}
.empty b{display:block;color:var(--ink);font-weight:500}

.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:430px;max-height:90%;overflow:auto;background:var(--bg);border-radius:6px 6px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#C8C8C6;margin:4px auto 6px}
.sheet .x{float:left;margin:-2px -8px 0 0}
.sheet h2{font-size:23px}
.ov.full .sheet{max-height:100%;height:100%;border-radius:0;background:#111;color:#fff;display:flex;flex-direction:column;padding:8px}
.ov.full img,.ov.full svg.big{flex:1;min-height:0;width:100%;object-fit:contain}
.ov.full .x{color:#fff;align-self:flex-start}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;font-size:14.5px;border-radius:2px;max-width:380px;width:max-content;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1;pointer-events:auto}
.toast button{background:none;border:1px solid #555;color:var(--bg);padding:6px 12px;min-height:36px;cursor:pointer;border-radius:2px;font-size:14px}
.toast span{padding:4px 0}

.mark{position:relative;margin-top:10px;user-select:none;touch-action:none}
.mark img{display:block;width:100%}
.mark .cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr)}
.mark .cells i{border:1px dashed rgba(255,255,255,.6)}
.mark .cells i.on{background:rgba(23,23,23,.5);border-style:solid}
.up{display:grid;place-items:center;gap:6px;border:1px dashed var(--soft);padding:26px 10px;text-align:center;color:var(--muted);font-size:15px;cursor:pointer;background:var(--surface)}
.up input{display:none}
.ok{color:#1F5C2E}.bad{color:#8A1F11}

.wait{display:grid;place-items:center;gap:12px;padding:34px 0;text-align:center}
.glass{width:36px;height:52px;animation:flip 1.6s ease-in-out infinite}
@keyframes flip{0%,70%{transform:rotate(0)}100%{transform:rotate(180deg)}}
.wait b{font-weight:500}
.wait small{color:var(--muted);font-size:14px}

.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 24px}
.login h1{font-size:40px}
.roles{display:grid;gap:8px;margin-top:8px}
.role{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:14px 16px;cursor:pointer}
.role b{display:block;font-family:var(--display);font-weight:500;font-size:20px}
.role span{display:block;color:var(--muted);font-size:14px}
.role.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.otp{display:flex;gap:8px;direction:ltr;justify-content:center;margin:12px 0}
.otp input{width:52px;height:60px;text-align:center;font-family:var(--mono);font-size:24px;border:1px solid var(--line);background:var(--surface);border-radius:2px}
.note{font-size:14px;color:var(--muted);line-height:1.55;margin-top:12px}
.intro{display:grid;gap:12px;margin:14px 0}
.intro div{display:flex;gap:12px;align-items:flex-start}
.intro i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);font-style:normal;display:grid;place-items:center;font-size:14px;font-family:var(--mono)}
.intro p{margin:0;font-size:15px;line-height:1.5}
.contract h4{font-size:15px;margin:16px 0 4px}
.contract p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.6}
.sel{position:relative}
.sel .ck{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.95);border:1px solid var(--line);display:grid;place-items:center;font-size:14px}
.sel[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px}
.sel[aria-pressed="true"] .ck{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="ov"></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="tt"></span><button id="tu" hidden>לבטל</button></div>
<script src="config.js" onerror=""></script>
<script>
'use strict';
/* ── data (demo) ── */
const VAT=18;
const ROLES={
  winery:{n:'יקב',who:'יקב הגבעה',p:'נוי',d:'לבחור יצירה, לבנות תווית, לבקש רישיון',u:'נ',hi:'שלום, נוי'},
  artist:{n:'אמן',who:'ארז אהרון',p:'ארז אהרון',d:'יצירות, בקשות והכנסות',u:'אא',hi:'שלום, ארז'},
  gallery:{n:'גלריה',who:'גלריה לדוגמה',p:'מנהלת הגלריה',d:'סגל, תמחור ועסקאות',u:'גל',hi:'גלריה לדוגמה'},
  curator:{n:'אוצר',who:'צוות האוצרות',p:'צוות האוצרות',d:'קבלה, קידום והדמיות',u:'או',hi:'צוות האוצרות'},
  printer:{n:'שותף דפוס',who:'דפוס לדוגמה',p:'דפוס לדוגמה',d:'הזמנות, קבצים ודיווח כמויות',u:'דפ',hi:'דפוס לדוגמה'},
  admin:{n:'מנהל מערכת',who:'תפעול',p:'מנהל המערכת',d:'משתמשים, עמלות, כספים ויומן',u:'מנ',hi:'תפעול'},
  customer:{n:'לקוח',who:'דרך יקב הגבעה',p:'דנה',d:'בוחר אמן ומעצב בקבוק אישי',u:'ד',hi:'שלום, דנה'}

/* ── routing (works with the phone's back button) ── */
const $=s=>document.querySelector(s);
function go(h){
  if(S.closing){S.pending=h;return}
  if(S.sheetOpen){S.pending=h;closeSheet();return}
  if(location.hash==='#'+h){applyHash(true);return}
  location.hash=h;
}
function applyHash(force){
  const h=location.hash.slice(1);S.closing=false;
  if(h.startsWith('sheet')){if(!S.sheetOpen)history.back();return}
  if(S.sheetOpen){S.sheetOpen=false;$('#ov').innerHTML=''}
  if(S.pending){const p=S.pending;S.pending=null;if(p!==h){location.hash=p;return}}
  if(!S.role){render();return}
  const [k,...r]=h.split('-');const v=r.join('-');
  const prev=JSON.stringify([S.tab,S.view]);
  if(k==='tab'&&TABS[S.role].some(t=>t[0]===v)){S.tab=v;S.view=null}
  else if((['deal','work','design','aw','order','list'].includes(k)||window.VX&&VX[k])&&v){S.view=[k,isNaN(+v)?v:+v]}
  else {S.tab=TABS[S.role][0][0];S.view=null}
  render();
  if(force||prev!==JSON.stringify([S.tab,S.view]))scrollTo(0,0);
}
addEventListener('hashchange',()=>applyHash());

  <main id="m" class="${sc.bar?'withbar':''}">${sc.html}</main>

function screen(){
  if(S.view){const [k,id]=S.view;
    if(k==='deal'&&deal(id))return vDeal(deal(id));
    if(k==='work'&&work(id))return {html:vWork(work(id))};

function bindMark(edit){

  const set=(c)=>{const store=edit?S._cells:S.upload.cells;store[c]=paint;mk.querySelector(`[data-cell="${c}"]`).classList.toggle('on',paint)};
  mk.addEventListener('pointerdown',e=>{const c=at(e);if(c==null)return;const store=edit?S._cells:S.upload.cells;paint=!store[c];set(c);mk.setPointerCapture(e.pointerId)});

}

  user(v){const u=S.users[+v];sheet(`<span class="eyebrow">${u[1]} · ${u[2]}</span><h2>${u[0]}</h2><div class="list" style="margin-top:12px"><button class="li" data-a="impS" data-v="${v}"><span class="mt"><b>כניסה לחשבון לצורך תמיכה</b><small>נרשמת ביומן עם הסיבה</small></span></button><button class="li" data-a="suspend" data-v="${v}"><span class="mt"><b>${u[3]==='פעיל'?'להשעות':'להחזיר לפעילות'}</b><small>${u[3]==='פעיל'?'המשתמש לא יוכל להיכנס':'המשתמש יוכל להיכנס שוב'}</small></span></button><button class="li" data-a="toast" data-v="שינוי תפקיד יתווסף בגרסה הבאה"><span class="mt"><b>לשנות תפקיד</b><small>${u[2]}</small></span></button></div>`)},
  impS(v){const u=S.users[+v];sheet(`<h2>כניסה לחשבון של ${u[0]}</h2><div class="fld"><label for="imr">סיבה, תירשם ביומן *</label><textarea id="imr" placeholder="למשל: בקשת עזרה בהעלאת קובץ"></textarea></div><div class="row"><button class="btn alt" data-a="close">ביטול</button><button class="btn" data-a="imp" data-v="${v}">להיכנס</button></div>`)},
  imp(v){const r=$('#imr').value.trim();if(!r){$('#imr').focus();return}log(`כניסה לחשבון ${S.users[+v][0]} לצורך תמיכה: ${r}`,'admin');closeSheet();toast('הכניסה נרשמה ביומן')},
  suspend(v){const u=S.users[+v];const to=u[3]==='פעיל'?'מושעה':'פעיל';confirmSheet({t:`${to==='מושעה'?'להשעות':'להחזיר'} את ${u[0]}?`,l:to==='מושעה'?'להשעות':'להחזיר',danger:to==='מושעה',ok(){u[3]=to;log(`${u[0]}: ${to}`,'admin')}})},
  savecomm(){const from=S.comm,to=S.commDraft;confirmSheet({t:`לשנות את העמלה מ־${from}% ל־${to}%?`,body:'<p class="note">השינוי חל רק על הצעות חדשות, ונרשם ביומן.</p>',l:'לשמור',ok(){S.comm=to;log(`עמלת פלטפורמה: ${from}% ← ${to}%`,'admin');toast('העמלה עודכנה')}})},
  savequota(){const q=+$('#quota').value.replace(/\D/g,'');if(!q){toast('צריך מספר');return}const p=S.quota;S.quota=q;log(`מכסת צילומים: ${p} ← ${q}`,'admin');toast('המכסה נשמרה',()=>{S.quota=p})},
  contract(v){contractSheet(v)},
  zoomimg(v){sheet(`<img src="${img(+v)}" alt="${esc(work(+v).t)}"><p style="text-align:center;font-size:14px;color:#ddd;margin:6px 0 10px">${esc(work(+v).t)} · ארז אהרון</p>`,'full')},
  zoomlabel(v){const d=deal(+v);zoomLabelSheet(dealBottle(d,{label:true,big:true}),'התווית בהגדלה: שם היין, הבציר ושם האמן')},
  zoomdesign(code){const d=S.designs.find(x=>x.code===code);const w=wine(d.wine);zoomLabelSheet(bottle(w.type,d.work,{wm:true,pos:d.pos,zoom:d.zoom,shape:d.shape,name:w.n,year:w.y,label:true,big:true}),code)},
  okconfirm(){const f=S._ok;S._ok=null;closeSheet();if(f)f();render()},
  addwine(){sheet(`<h2>להוסיף יין</h2><div class="fld"><label for="wn">שם היין</label><input id="wn" placeholder="למשל: אדום הגבעה"></div><div class="two"><div class="fld"><label for="wy">בציר</label><input id="wy" inputmode="numeric" value="${new Date().getFullYear()-1}"></div><div class="fld"><label for="wq">כמות בקבוקים</label><input id="wq" inputmode="numeric" placeholder="3,000"></div></div><div class="fld"><label for="wt">סוג</label><select id="wt"><option value="red">אדום</option><option value="white">לבן</option><option value="rose">רוזה</option></select></div><div class="row"><button class="btn alt" data-a="close">ביטול</button><button class="btn" data-a="addwine2">להוסיף</button></div>`)},
  addwine2(){const n=$('#wn').value.trim(),y=+$('#wy').value,q=+$('#wq').value.replace(/\D/g,'');if(!n||!y||!q){toast('צריך שם, בציר וכמות');return}S.wines.push({id:Math.max(...S.wines.map(w=>w.id))+1,n,y,type:$('#wt').value,q});closeSheet();toast('היין נוסף');render()},
  upload(){if(window.GAAgree&&GAAgree.need()){GAAgree.open('upload');return}S.upload=null;uploadSheet()},
  doupload(){const u=readUpload();if(!u)return;
    const id=Math.max(...S.works.map(w=>w.id))+1;S.works.push({id,t:u.t,tag:u.g,tone:u.tn,tech:u.tc,orig:u.o,st:'pending',av:true,src:u.src,y:u.y?+u.y:'',sz:u.s,cells:{...u.cells},artist:u.a,artistN:u.an});if(u.st){S.stories=S.stories||{};S.stories[id]=u.st}log(`האמן העלה את "${u.t}"`,'work');S.upload=null;closeSheet();toast('היצירה נשלחה לאישור הגלריה');render()}
};
function pricingSheet(d){
  const p0=price({...d,adj:0}),p=price({...d,adj:S._adj});
  sheet(`<span class="eyebrow">בקשה ${d.id} · ${esc(d.winery)}</span><h2>תמחור</h2><div class="panel" style="margin-top:10px"><dl><dt>יצירה</dt><dd>${esc(work(d.work).t)}</dd><dt>סוג</dt><dd>${TYPES[d.lt].n} · ${QTY[d.q].n}${d.ex?' · בלעדי':''}</dd><dt>מהמחירון</dt><dd class="m">${nis(p0.total)}</dd></dl></div>
  <div class="fld"><label for="adj" id="adjl">${adjLabel(p)}</label><input id="adj" type="range" min="-15" max="15" step="5" value="${S._adj}" data-in="adj" data-v="${d.id}"></div>
  <div class="panel" style="margin-top:10px" id="adjp">${adjSplit(p)}</div>
  <div class="fld"><label for="pnote">הערה ליקב, חובה אם שיניתם את המחיר</label><textarea id="pnote" placeholder="למשל: מחיר מיוחד לבציר הראשון">${esc(S._pnote||'')}</textarea></div>
  <div class="row"><button class="btn alt" data-a="close">ביטול</button><button class="btn" data-a="price" data-v="${d.id}">לאשר ולהעביר לאמן</button></div>
  <button class="link" style="margin-top:14px;display:block" data-a="rejectS" data-v="${d.id}">לא מתאים? לדחות את הבקשה</button>`);
}
A.price=function(v){const d=deal(+v);const note=$('#pnote').value.trim();if(S._adj&&!note){$('#pnote').closest('.fld').classList.add('bad');$('#pnote').focus();return}d.adj=S._adj;d.note=note;S._pnote='';
  if(note)d.chat.push({w:'gallery',t:note,at:now()});
  if(S.pre&&d.lt==='one'&&d.q==='a'){d.st='sign';sys(d,'הגלריה תמחרה, והאמן נתן הסכמה מראש')}else{d.st='priced';sys(d,'הגלריה תמחרה והעבירה לאמן')}
  S.renderQ.push({deal:d.id,ok:null});closeSheet();toast('ההצעה עברה הלאה');render()};
const adjLabel=p=>`התאמה: <span class="num">${S._adj>0?'+':''}${S._adj}%</span> · מחיר חדש <span class="num">${nis(p.total)}</span>`;
const adjSplit=p=>`<dl><dt class="tot">לגלריה</dt><dd class="m tot">${nis(p.gallery)}</dd></dl><details class="more"><summary>איך זה מחושב</summary><dl><dt>מחיר הרישיון</dt><dd class="m">${nis(p.total)}</dd><dt>עמלת פלטפורמה ${S.comm}%</dt><dd class="m">${nis(p.comm)}</dd><dt>לאמן</dt><dd class="m">${nis(p.artist)}</dd></dl></details>`;
function catSheet(){const c=S._cat;const n=Object.values(c.sel).filter(Boolean).length;sheet(`<h2>קטלוג התאמה</h2><div class="fld"><label>ליקב</label><div class="chips">${(window.CATW||['יקב עמק הארזים','יקב הגבעה','יקב חדש']).map(w=>`<button class="chip" data-a="catw" data-v="${w}" aria-pressed="${c.w===w}">${w}</button>`).join('')}</div></div><h3>יצירות (${n} נבחרו)</h3><div class="grid">${S.works.filter(w=>w.st==='live').map(w=>`<button class="tile sel" data-a="cats" data-v="${w.id}" aria-pressed="${!!c.sel[w.id]}"><span class="ph" style="background-image:url(${img(w.id)})"></span><span class="ck">${c.sel[w.id]?'✓':''}</span><span class="cp">${esc(w.t)}</span></button>`).join('')}</div><button class="btn wide" style="margin-top:14px;position:sticky;bottom:0" data-a="catmake" ${n?'':'disabled'}>להפיק קטלוג${n?` עם ${n} הדמיות`:''}</button>`)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.classList.contains('ov')&&e.target!==t)return;
  if(t.closest('.sheet')&&t.classList.contains('ov'))return;
  const f=A[t.dataset.a];if(f){e.preventDefault();f(t.dataset.v);save()}
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in;
  if(e.target.dataset.otp!=null){const i=+e.target.dataset.otp;if(e.target.value&&i<3)$(`[data-otp="${i+1}"]`).focus();if(i===3&&e.target.value)A.login2();return}
  if(!k)return;
  if(k==='q'){S.f.q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(pos,pos)}
  if(k==='uq'){S.uq=e.target.value;const pos=e.target.selectionStart;render();const i=document.querySelector('[data-in="uq"]');i.focus();i.setSelectionRange(pos,pos)}
  if(k==='dq'){S.f.dq=e.target.value;const pos=e.target.selectionStart;render();const i=$('#dq');i.focus();i.setSelectionRange(pos,pos)}
  if(k==='comm'){S.commDraft=+e.target.value;render()}
  if(k==='floor'){S.floorDraft=+e.target.value.replace(/\D/g,'')||0;$('#plist').innerHTML=plist(S.floorDraft)}
  if(k==='adj'){S._adj=+e.target.value;const p=price({...deal(+e.target.dataset.v),adj:S._adj});$('#adjl').innerHTML=adjLabel(p);$('#adjp').innerHTML=adjSplit(p)}
  if(k==='tpos'||k==='tz'){S.draft[k==='tpos'?'pos':'zoom']=+e.target.value;const wi=wine(S.draft.wine);$('#tryh').innerHTML=bottle(wi.type,S.draft.work,{wm:true,pos:S.draft.pos,zoom:S.draft.zoom,shape:S.draft.shape,name:wi.n,year:wi.y})+'<span class="wm">הדמיה · סימן מים עד התשלום</span>'}
  if(k==='cfc'){$('#cfok').disabled=!e.target.checked}
  if(k==='bio'){S.bio=e.target.value}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.in==='rights'){if(S.upload){S.upload[e.target.id==='ur1'?'r1':'r2']=e.target.checked;if(S.upload.r1&&S.upload.r2&&S.upload.e)S.upload.e.r=false}return}
  if(e.target.dataset.in==='ackw'){if(S.upload){keepTyped0();S.upload._ack=e.target.checked;uploadSheet()}return}
  if(e.target.dataset.in==='file'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{S.upload={src:r.result,cells:{},w:im.naturalWidth,h:im.naturalHeight,e:{},a:S.upload?.a,r1:S.upload?.r1,r2:S.upload?.r2,check:null};const mine=S.upload;uploadSheet();if(window.fileCheck)fileCheck(f,r.result).then(c=>{if(S.upload!==mine)return;keepTyped0();mine.check=c;mine.phash=c.info.phash;uploadSheet();if(c.ok&&window.autoFill)autoFill()});else window.autoFill&&autoFill()};im.onerror=()=>{if(window.fileCheck)fileCheck(f,r.result).then(c=>{S.upload={src:null,cells:{},w:0,h:0,e:{},check:c};uploadSheet()})};im.src=r.result};r.readAsDataURL(f)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheetOpen)closeSheet();if(e.key==='Enter'&&e.target.id==='chatin'){document.querySelector('[data-a="chat"]')?.click()}if(e.key==='Enter'&&e.target.id==='ph')A.login1()});
if(window.LIVE){}else if(location.hash)history.replaceState(null,'',location.pathname+location.search);
if(window.LIVE){}else if(S.role){S.view=null;S.tab=S.tab||TABS[S.role][0][0];location.hash='tab-'+S.tab}else render();
</script>
