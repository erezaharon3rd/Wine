<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grape Arts · חוברת הדרכה להדפסה</title>
<meta name="robots" content="noindex">
<style>
@page{size:A4;margin:0}
html,body{margin:0;background:#E9E2D8}
body{font-family:'Heebo','IBM Plex Sans Hebrew',Arial,sans-serif;color:#1F1B2D;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:#1F1B2D;color:#fff;font-size:15px}
.bar button{font:inherit;font-weight:700;border:0;border-radius:12px;background:#F5B83D;color:#1F1B2D;min-height:44px;padding:0 18px;cursor:pointer}
.wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0 40px}
.page{width:210mm;height:297mm;box-sizing:border-box;padding:12mm 11mm 10mm;background:radial-gradient(120% 60% at 50% 0%,#fff 0%,#FFF8EE 60%,#FCEBD9 100%);display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 6px 20px #0002;page-break-after:always;break-after:page}
.page:last-child{page-break-after:auto;break-after:auto}
.ph{display:flex;align-items:center;gap:4mm;border-bottom:2px dashed #E3D3C0;padding-bottom:3mm;margin-bottom:4mm}
.ph .gd-ch{--s:22mm}.ph .gd-ch figcaption{display:none}
.ph h1{margin:0;font-size:24pt;line-height:1.05;font-weight:800}
.ph p{margin:1mm 0 0;font-size:11pt;color:#5A5268}
.ph .no{margin-inline-start:auto;font-size:10pt;color:#9A8FA8;font-weight:700}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,minmax(0,1fr));gap:4mm}
.pn{min-height:0;background:#fff;border-radius:5mm;border:2px solid #1F1B2D;box-shadow:1.2mm 1.2mm 0 #1F1B2D;display:flex;flex-direction:column;overflow:hidden;position:relative}
.pn .vis{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:2mm 3mm 0;background:linear-gradient(#FFF8EE,#fff)}
.pn .txt{padding:1.5mm 4mm 3mm;text-align:center}
.pn h3{margin:0;font-size:12.5pt;line-height:1.15;font-weight:800}
.pn .txt p{margin:.6mm 0 0;font-size:9.5pt;line-height:1.3;color:#5A5268}
.pn .n{position:absolute;top:2mm;inset-inline-start:2mm;width:7mm;height:7mm;border-radius:50%;background:#E0457B;color:#fff;font-size:9pt;font-weight:800;display:grid;place-items:center;z-index:5}
.foot{display:flex;justify-content:space-between;font-size:9pt;color:#9A8FA8;margin-top:3mm}
/* הסצנות מהמדריך, קפואות לדפוס */
.page *{animation:none!important}
.pn .gd-cast{gap:2mm 3mm;max-width:none}.pn .gd-cast .gd-ch{--s:15mm}
.pn .gd-ch figcaption{font-size:7pt;padding:0 2mm;box-shadow:none;border:1px solid #EAE0D3}
.pn .gd-flow{height:100%;max-height:52mm;max-width:none;padding:0 2mm}
.pn .gd-lane path{stroke-width:2}.pn .gd-flow .gd-ch{--s:19mm}
.pn .gd-item{right:calc(50% - 5mm);width:10mm;height:10mm;top:14%}
.pn .gd-lane svg{top:16%}
.pn .gd-shot{height:100%}.pn .gd-phone{border-radius:3.2mm;padding:.8mm;box-shadow:none;max-height:none}.pn .gd-scr{border-radius:2.6mm}
.pn .gd-ring{opacity:1;border-width:2px;border-radius:1.6mm}
.pn .gd-tap{width:3.6mm;height:3.6mm;border-width:1.5px}
.pn .gd-peek{bottom:0;inset-inline-start:4mm}.pn .gd-peek .gd-ch{--s:12mm}
.pn .gd-ch svg{filter:none}
/* שער */
.cover{justify-content:space-between;text-align:center}
.cover h1{margin:8mm 0 0;font-size:44pt;line-height:1;font-weight:900;color:#7B4BC4}
.cover .sub{font-size:16pt;margin:3mm 0 0;color:#5A5268}
.cover .gd-cast{max-width:none;gap:6mm 8mm}.cover .gd-cast .gd-ch{--s:36mm}
.cover .gd-ch figcaption{font-size:11pt}
.toc{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;text-align:center}
.toc div{background:#fff;border:2px solid #1F1B2D;border-radius:4mm;padding:2mm;font-size:10pt;font-weight:700}
.toc .gd-ch{--s:14mm}.toc .gd-ch figcaption{display:none}
.how{background:#1F1B2D;color:#fff;border-radius:5mm;padding:4mm 6mm;font-size:11pt;text-align:right;display:flex;gap:5mm;align-items:center}
.how b{color:#F5B83D}
@media screen and (max-width:820px){.wrap{gap:10px}.page{box-shadow:0 3px 10px #0002}}
@media print{html,body{background:none}.bar{display:none}.wrap{display:block;padding:0}.page{box-shadow:none;margin:0;zoom:1!important}}
</style>
</head>
<body>
<div class="bar"><span>חוברת ההדרכה להדפסה · A4</span><button type="button" id="pr">להדפסה או PDF</button></div>
<div class="wrap" id="w"></div>
<script src="guide.js?v=3"></script>
<script>
(function(){
const {G,CH,scene,css,who}=GAGuide.data;css();
const ORDER=[['buyer','קונה בחנות'],['customer','לקוח של יקב'],['winery','יקב'],['artist','אמן'],['gallery','גלריה'],['curator','אוצר'],['printer','בית דפוס'],['admin','מנהל המערכת']];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let pages=[],no=1;
pages.push(`<section class="page cover"><div><h1>Grape Arts</h1><p class="sub">אמנות ישראלית על יין ישראלי · חוברת הדרכה</p></div>
 <div class="gd-cast">${['buyer','artist','gallery','winery','ga'].map(k=>who(k)).join('')}</div>
 <div><div class="toc">${ORDER.map(([k,n])=>`<div>${who(k==='customer'?'customer':k)}${n}</div>`).join('')}</div></div>
 <div class="how"><div>${who('ga')}</div><div><b>גם באתר, עם הנפשה:</b> בכל מסך יש כפתור <b>?</b> שפותח את ההדרכה של התפקיד שלך. בחנות: הקישור "הדרכה" למעלה.<br>grapearts.com</div></div></section>`);
for(const [k,n] of ORDER){
  const g=G[k],sc=g.s;
  const per=sc.length>8?Math.ceil(sc.length/2):8;
  for(let i=0;i<sc.length;i+=per){
    const part=sc.slice(i,i+per),cont=i>0,rows=Math.max(2,Math.ceil(part.length/2));
    pages.push(`<section class="page"><div class="ph">${who(k)}<div><h1>${esc(g.t)}${cont?' · המשך':''}</h1><p>${esc(n)}</p></div><span class="no">${no+1}</span></div>
     <div class="grid" style="grid-template-rows:repeat(${rows},minmax(0,1fr))">${part.map((s,j)=>`<div class="pn"><span class="n">${i+j+1}</span><div class="vis">${scene(s)}</div><div class="txt"><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></div></div>`).join('')}</div>
     <div class="foot"><span>Grape Arts · ${esc(g.t)}</span><span>grapearts.com</span></div></section>`);
    no++;
  }
}
document.getElementById('w').innerHTML=pages.join('');
function fit(){const z=Math.min(1,(innerWidth-16)/794);document.querySelectorAll('.page').forEach(p=>p.style.zoom=matchMedia('print').matches?1:z)}
fit();addEventListener('resize',fit);
document.getElementById('pr').onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.style.zoom=1);print();setTimeout(fit,500)};
addEventListener('afterprint',fit);
})();
</script>
</body>
</html>
