<html lang="he" dir="rtl">

<meta charset="utf-8">

<title>Grape Arts · דף תפקיד</title>
<meta name="robots" content="noindex">
<style>
@page{size:A3;margin:0}
html,body{margin:0;background:#E9E2D8}
body{font-family:'Heebo','IBM Plex Sans Hebrew',Arial,sans-serif;color:#1F1B2D;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#1F1B2D;color:#fff;font-size:14px}
.bar select,.bar button{font:inherit;min-height:44px;border-radius:12px;border:0;padding:0 14px}
.bar button{font-weight:700;background:#F5B83D;color:#1F1B2D;cursor:pointer}
.wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 0 40px}
.sheet{width:297mm;height:420mm;box-sizing:border-box;padding:16mm 16mm 12mm;background:radial-gradient(130% 55% at 50% 0%,#fff 0%,#FFF8EE 55%,#FCEBD9 100%);display:flex;flex-direction:column;gap:9mm;overflow:hidden;box-shadow:0 6px 20px #0002;break-after:page;page-break-after:always}
.sheet:last-child{break-after:auto;page-break-after:auto}
/* כותרת */
.hd{display:flex;align-items:center;gap:10mm}
.hd .gd-ch{--s:62mm}.hd .gd-ch figcaption{display:none}
.hd .k{font-size:15pt;font-weight:700;color:#9A8FA8;letter-spacing:.02em}
.hd h1{margin:1mm 0 0;font-size:48pt;line-height:1;font-weight:900}
.hd p{margin:3mm 0 0;font-size:19pt;line-height:1.3;color:#4A4358;max-width:150mm}
.brand{margin-inline-start:auto;align-self:flex-start;display:flex;flex-direction:column;align-items:center;gap:1mm;font-family:'Frank Ruhl Libre','David Libre',Georgia,serif;font-size:12pt;letter-spacing:.18em;color:#1F1B2D}
.brand svg{width:22mm;height:22mm}
/* מה אפשר */
h2{margin:0;font-size:22pt;font-weight:800;display:flex;align-items:center;gap:4mm}
h2 i{display:inline-block;width:10mm;height:3mm;border-radius:9px;background:#E0457B}
.can{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(44mm,60mm);align-content:center;gap:7mm}
.t{background:#fff;border:2.4px solid #1F1B2D;border-radius:7mm;box-shadow:1.6mm 1.6mm 0 #1F1B2D;padding:6mm;display:flex;gap:5mm;align-items:center}
.t .ic{flex:none;width:28mm;height:28mm;border-radius:50%;display:grid;place-items:center}
.t .ic svg{width:17mm;height:17mm}
.t b{display:block;font-size:18pt;line-height:1.15;font-weight:800}
.t span{display:block;font-size:13pt;line-height:1.3;color:#5A5268;margin-top:1mm}
/* איך */
.how{display:flex;align-items:stretch;gap:0}
.st{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2mm;position:relative}
.st .ic{width:36mm;height:36mm;border-radius:50%;background:#fff;border:2.4px solid #1F1B2D;display:grid;place-items:center;position:relative}
.st .ic svg{width:20mm;height:20mm}
.st .n{position:absolute;top:-2mm;inset-inline-start:-2mm;width:9mm;height:9mm;border-radius:50%;background:#E0457B;color:#fff;font-weight:800;font-size:12pt;display:grid;place-items:center}
.st b{font-size:16pt;font-weight:800;line-height:1.15}
.st span{font-size:12pt;color:#5A5268;line-height:1.25;max-width:44mm}
.ar{flex:none;width:12mm;display:flex;align-items:flex-start;padding-top:14mm}
.ar svg{width:12mm;height:8mm}
/* איפה */
.where{display:flex;gap:6mm;align-items:center;background:#1F1B2D;color:#fff;border-radius:7mm;padding:5mm 7mm}
.where .q{flex:none;width:16mm;height:16mm;border-radius:50%;background:#F5B83D;color:#1F1B2D;display:grid;place-items:center;font-size:22pt;font-weight:900}
.where p{margin:0;font-size:13.5pt;line-height:1.35}
.where b{color:#F5B83D}
.where .url{margin-inline-start:auto;font-size:13pt;letter-spacing:.04em;white-space:nowrap;opacity:.85}
.gold{color:#F5B83D}
@media print{html,body{background:none}.bar{display:none}.wrap{display:block;padding:0}.sheet{box-shadow:none;zoom:1!important}}
</style>
</head>

   <div class="can">${r.can.map(([ic,b,s],i)=>`<div class="t"><div class="ic" style="background:${BG[i%BG.length]}">${I[ic]}</div><div><b>${b}</b><span>${s}</span></div></div>`).join('')}</div>
   <h2><i style="background:#F5B83D"></i>איך זה זורם</h2>
   <div class="how">${r.how.map(([ic,b,s],i)=>`${i?`<div class="ar">${AR}</div>`:''}<div class="st"><div class="ic">${I[ic]}<span class="n">${i+1}</span></div><b>${b}</b><span>${s}</span></div>`).join('')}</div>
   <div class="where"><div class="q">?</div><p>${r.where}<br>בכל רגע אפשר לפתוח שוב את ההדרכה המונפשת.</p><span class="url">grapearts.com</span></div>
  </section>`;
}
const sel=document.getElementById('rl'),w=document.getElementById('w');
const only=new URLSearchParams(location.search).get('r');
sel.innerHTML=`<option value="">כל התפקידים</option>`+R.map(r=>`<option value="${r.k}">${r.n}</option>`).join('');
function show(k){sel.value=k||'';w.innerHTML=R.filter(r=>!k||r.k===k).map(sheet).join('');fit()}
function fit(){const z=matchMedia('print').matches?1:Math.min(1,(innerWidth-16)/1123);document.querySelectorAll('.sheet').forEach(p=>p.style.zoom=z)}
sel.onchange=()=>{const k=sel.value;history.replaceState(null,'',k?'?r='+k:location.pathname);show(k)};
document.getElementById('pr').onclick=()=>{document.querySelectorAll('.sheet').forEach(p=>p.style.zoom=1);print();setTimeout(fit,500)};
addEventListener('resize',fit);addEventListener('afterprint',fit);
show(R.some(r=>r.k===only)?only:'');
})();
</script>
</body>
