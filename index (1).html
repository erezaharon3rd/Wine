<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout idea: one 430px phone column. Quiet studio greys everywhere;
   the only colour is the red wool thread, used for what is chosen. */
:root{
  --bg:#EDEDEB; --surface:#FAFAF8; --ink:#1F1F1E; --muted:#6B6B68; --line:#D5D5D1;
  --thread:#B3202A; --ok:#2E7D4F; --warn:#A8610A; --bad:#9C1F4E;
  --display:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --body:"IBM Plex Sans Hebrew","Heebo","Arial Hebrew",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#161615;--surface:#20201F;--ink:#EDEDEA;--muted:#A3A39E;--line:#383836;--thread:#E5525B;--ok:#6BCB94;--warn:#F0A04B;--bad:#F08AB0;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#161615;--surface:#20201F;--ink:#EDEDEA;--muted:#A3A39E;--line:#383836;--thread:#E5525B;--ok:#6BCB94;--warn:#F0A04B;--bad:#F08AB0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}
.app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
:focus-visible{outline:2px solid var(--thread);outline-offset:2px}

.hdr{position:sticky;top:0;z-index:6;height:44px;display:flex;align-items:center;gap:2px;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr button{background:none;border:0;padding:8px 9px;font-size:14px;color:var(--muted);cursor:pointer;border-radius:4px}
.hdr button[aria-current="page"]{color:var(--ink);font-weight:600}
.hdr .save{margin-inline-start:auto;font-size:12px;color:var(--muted);transition:color .3s}
.hdr .save.on{color:var(--ok)}

main{flex:1;padding:16px 16px 24px}
h1{font-family:var(--display);font-weight:900;font-size:32px;line-height:1.1;margin:8px 0 8px;text-wrap:balance}
h2{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
h3{font-size:14.5px;font-weight:600;margin:0;display:flex;align-items:center;gap:6px}
.lead{color:var(--muted);font-size:15px;margin:0 0 16px}
.prog{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.bar{height:3px;background:var(--line);border-radius:2px;margin-bottom:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--thread)}

.track{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px;cursor:pointer}
.track b{display:block;font-family:var(--display);font-weight:900;font-size:21px}
.track span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.track em{font-style:normal;font-size:12px;color:var(--thread);font-weight:600}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;font-size:13.5px;cursor:pointer}

.mock{position:sticky;top:44px;z-index:4;background:var(--bg);padding-bottom:8px;margin:-4px 0 8px}
.mock svg{display:block;width:100%;height:232px;border-radius:6px;border:1px solid var(--line)}
.mock.big svg{height:auto;aspect-ratio:300/380}
.mock .sum{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:12px;color:var(--muted);margin-top:6px}
.mock .sum div{display:grid;gap:1px}.mock .sum b{color:var(--ink);font-size:13px}
.pill{flex:none;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--ok);color:var(--ok)}.pill.w{border-color:var(--warn);color:var(--warn)}
.mock .cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:5px}

.grp{margin-top:18px;display:grid;gap:8px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card .pk{display:block;width:100%;padding:0;border:0;background:none;text-align:start;cursor:pointer}
.card .img{display:block;height:82px;width:100%;overflow:hidden;background:var(--line)}
.card .img svg{display:block;width:100%;height:82px}
.card .cp{display:block;padding:7px 9px 9px;font-size:13.5px;line-height:1.3;min-height:50px}
.card .sel{display:none;font-size:11.5px;font-weight:600;color:var(--thread);margin-top:2px}
.card[data-on="1"]{border-color:var(--thread);box-shadow:0 0 0 1px var(--thread)}
.card[data-on="1"] .sel{display:block}
.card .flag{position:absolute;top:4px;left:4px;font-size:10.5px;padding:3px 6px;border-radius:999px;border:0;background:rgba(20,20,20,.62);color:#fff;cursor:pointer}
.card .flag[aria-pressed="true"]{background:var(--thread)}
.q{background:none;border:1px solid var(--line);width:20px;height:20px;border-radius:50%;font-size:11.5px;line-height:1;padding:0;color:var(--muted);cursor:pointer;flex:none}

.stp{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.stp .ctl{display:flex;align-items:center;gap:8px}
.stp button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;cursor:pointer}
.stp output{min-width:64px;text-align:center;font-family:var(--mono);font-size:15px;direction:ltr}
.fld{display:grid;gap:4px}
.fld label{font-size:13px;font-weight:600}
.fld input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.alerts{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.alerts li{font-size:13.5px;padding:9px 11px;border-inline-start:3px solid var(--ok);background:var(--surface);border-radius:3px}
.alerts li.warn{border-color:var(--warn)} .alerts li.bad{border-color:var(--bad)} .alerts li.info{border-color:var(--muted)}
.alerts b{font-weight:600} .alerts .lv{font-size:11px;font-weight:600;margin-inline-end:6px}
.alerts .warn .lv{color:var(--warn)} .alerts .bad .lv{color:var(--bad)} .alerts .ok .lv{color:var(--ok)} .alerts .info .lv{color:var(--muted)}
.alerts button{display:block;margin-top:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}

.btn{display:inline-block;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:6px;padding:12px 16px;font-weight:600;cursor:pointer;text-align:center}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.btn.wide{display:block;width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn[hidden]{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.foot{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line)}
.foot .btn{flex:1}.foot .btn.alt{flex:0 0 auto}

.sec{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}
.sec h2{font-size:20px}
dl{display:grid;grid-template-columns:minmax(104px,38%) 1fr;gap:5px 10px;margin:8px 0 0;font-size:14px}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere}
ul.plain{margin:8px 0 0;padding-inline-start:18px;font-size:14.5px}
ul.plain li+li{margin-top:6px}
.brief h4{font-size:14px;margin:14px 0 0;display:flex;gap:8px;align-items:baseline}
.brief h4 .num{color:var(--thread);font-size:11.5px}
#status{font-size:13px;color:var(--muted);min-height:20px;margin-top:6px}

.item{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
.item .n{font-family:var(--mono);font-size:18px;width:26px;text-align:center;flex:none}
.item svg{width:56px;height:72px;border-radius:4px;flex:none}
.item .meta{flex:1;min-width:0;font-size:13.5px}
.item .meta small{display:block;color:var(--muted);font-size:12px}
.item .acts{display:flex;flex-direction:column;gap:4px}
.item .acts button{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}

.prop .cp{min-height:70px}
.prop .img,.prop .img svg{height:150px}

.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{width:100%;max-width:430px;max-height:82%;overflow:auto;background:var(--surface);border-radius:14px 14px 0 0;padding:18px 16px 24px}
.modal h2{font-size:20px}
.modal dl{grid-template-columns:1fr;gap:2px}
.modal dt{color:var(--ink);font-weight:600;margin-top:12px}
.modal dd{color:var(--muted);font-size:14.5px}
.wait{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.wait svg{width:64px;height:84px}
.wait p{margin:0;font-size:15px;color:var(--muted);min-height:24px}
@media (prefers-reduced-motion:no-preference){
  .hg{animation:turn 1.9s ease-in-out infinite;transform-origin:50% 50%}
  .sand{animation:fall .5s linear infinite}
  @keyframes turn{0%,70%{transform:rotate(0)}100%{transform:rotate(180deg)}}
  @keyframes fall{from{stroke-dashoffset:0}to{stroke-dashoffset:-6}}
}

/* ── grey, quiet, luxurious ── */
:root{--bg:#F3F3F2;--surface:#FFFFFF;--ink:#171717;--muted:#6A6A68;--line:#E1E1DF;--thread:#171717;--ok:#4B4B49;--warn:#171717;--bad:#171717;--soft:#9C9C99}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--surface:#1C1C1C;--ink:#EDEDEC;--muted:#A2A2A0;--line:#2E2E2D;--thread:#EDEDEC;--ok:#BDBDBB;--warn:#EDEDEC;--bad:#EDEDEC;--soft:#6E6E6C}}
:root[data-theme="dark"]{--bg:#121212;--surface:#1C1C1C;--ink:#EDEDEC;--muted:#A2A2A0;--line:#2E2E2D;--thread:#EDEDEC;--ok:#BDBDBB;--warn:#EDEDEC;--bad:#EDEDEC;--soft:#6E6E6C}
body{font-weight:400;letter-spacing:.005em}
main{padding:20px 20px 28px}
h1{font-weight:500;font-size:34px;letter-spacing:-.01em;margin:14px 0 10px}
h2{font-weight:500;font-size:26px;margin:0 0 6px}
h3{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.lead{font-size:15.5px;line-height:1.6;margin:0 0 18px}
.hdr{background:var(--bg);border-bottom:1px solid var(--line);padding:0 14px}
.hdr button{font-size:13.5px;letter-spacing:.02em}
.prog{font-size:12px;letter-spacing:.08em;color:var(--soft);margin-bottom:8px}
.bar{height:1px;background:var(--line);margin-bottom:18px;overflow:visible}.bar i{height:1px;background:var(--ink)}
.track{border-radius:2px;padding:20px 18px;margin-bottom:12px;border-color:var(--line)}
.track b{font-weight:500;font-size:23px;margin-top:4px}.track em{color:var(--soft);font-weight:400;letter-spacing:.06em}
.grp{margin-top:26px;gap:10px}
.cards{gap:12px}
.card{border-radius:2px;border-color:var(--line)}
.card .img{height:104px}.card .img svg,.card .img img{display:block;width:100%;height:104px;object-fit:cover}
.card .cp{padding:9px 10px 11px;font-size:13.5px;min-height:54px}
.card[data-on="1"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.card .sel,.card .far{font-size:11.5px;font-weight:500;color:var(--ink);letter-spacing:.02em}
.card .far{display:block;margin-top:2px;color:var(--muted)}
.card.far{border-style:dashed;border-color:var(--soft)}.card.far .img{opacity:.45;filter:grayscale(1)}
.card .flag{width:22px;height:22px;padding:0;font-size:11px;border-radius:50%;background:rgba(20,20,20,.45)}
.card .flag[aria-pressed="true"]{background:#171717;outline:1.5px solid #fff}
.prop .img,.prop .img svg{height:160px}
.q{border-color:var(--soft);color:var(--muted)}
.stp,.fld input{border-radius:2px}
.btn{border-radius:2px;font-weight:500;padding:13px 18px;letter-spacing:.02em}
.foot{background:var(--bg);padding:12px 20px}
.mock svg{border-radius:2px;border-color:var(--line);height:236px}
.pill,.pill.w{border-color:var(--line);color:var(--muted);font-weight:400}.pill.w{border-color:var(--ink);color:var(--ink)}
.alerts li{border-radius:0;background:var(--surface);border-inline-start-width:2px;border-color:var(--line)}
.alerts li.warn{border-color:var(--soft)}.alerts li.bad{border-color:var(--ink);border-inline-start-width:4px}
.alerts .lv{color:var(--muted) !important;font-weight:500;letter-spacing:.04em}
.alerts button{border-radius:2px;border-color:var(--ink);padding:6px 12px}
.sec{margin-top:28px;padding-top:22px}.sec h2{font-size:21px}
.item{border-radius:2px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:4px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:1px solid transparent;margin-bottom:-1px;padding:8px 0 10px;font-size:14.5px;color:var(--soft);cursor:pointer;flex:none}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.axes{display:grid;gap:12px;margin:8px 0 14px}
.axis{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.axis span:last-child{text-align:end}
.axis i{position:relative;height:1px;background:var(--soft)}
.axis b{position:absolute;top:-5px;width:11px;height:11px;margin-inline-start:-5.5px;border-radius:50%;background:var(--ink)}
.term{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.term .img{display:block;height:62px;overflow:hidden;background:var(--line)}.term .img svg{display:block;width:100%;height:62px}
.term b{font-weight:500}.term p{margin:2px 0 0;font-size:14.5px;color:var(--muted)}
.term.one{border-top:0;grid-template-columns:1fr}.term.one .img,.term.one .img svg{height:150px}
.src{padding:12px 0;border-top:1px solid var(--line)}.src b{font-weight:500}.src p{margin:2px 0 4px;font-size:14.5px;color:var(--muted)}.src a{font-size:13.5px;color:var(--ink)}
.modal .sheet{border-radius:2px 2px 0 0;padding:22px 20px 26px}
.mock .photo{display:block;width:100%;border:1px solid var(--line);border-radius:2px}

/* ── calmer wizard: text chips for simple choices, small thumbnails only where the picture informs ── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);border-radius:2px;padding:10px 14px;font-size:14.5px;cursor:pointer;color:var(--ink)}
.chip i{width:12px;height:12px;border-radius:50%;border:1px solid var(--soft);flex:none}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:500}
.chip[aria-pressed="true"]::before{content:"✓";font-size:12px}
.card .img,.card .img svg,.card .img img{height:72px}
.card .img{background:var(--bg);border-bottom:1px solid var(--line)}
.card .cp{min-height:0;padding:8px 10px 10px}
.mock svg{height:190px}
.mock{margin-bottom:4px}
.grp{margin-top:22px}
.prop .img,.prop .img svg{height:160px}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:10px;min-height:60px;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:2px;text-align:start;font-size:14px;line-height:1.3;color:var(--ink);cursor:pointer}
.opt .ico{width:44px;height:44px;flex:none;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:500}
.opt[aria-pressed="true"] .ico{color:var(--ink)}
.story{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;width:100%;margin-top:8px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:2px;text-align:start;font-size:14.5px;line-height:1.45;color:var(--ink);cursor:pointer}
.story .img{display:block;height:64px;overflow:hidden}.story .img svg{display:block;width:100%;height:64px}
.story em{display:block;font-style:normal;font-size:11.5px;letter-spacing:.06em;color:var(--soft)}
.story[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.why{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px}
.opt:disabled,.card .pk:disabled{cursor:default}
.opt:disabled .ico,.card .pk:disabled .img{opacity:.25;filter:grayscale(1)}
.opt:disabled,.card:has(.pk:disabled){background:transparent;border-style:dashed;color:var(--soft)}
.note{font-size:13.5px;color:var(--ink);border-inline-start:2px solid var(--ink);padding:4px 10px;margin:0 0 12px}

.story em{font-size:16px;font-weight:500;letter-spacing:0;color:var(--ink);margin-bottom:2px}
.story .eg{display:block;font-size:13.5px;color:var(--muted)}
.lblrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lblrow .link{font-size:12.5px;padding:0}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:10px 12px;resize:vertical;min-height:132px;line-height:1.5}

.ups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.up{display:grid;gap:2px;justify-items:start}
.up>button:first-child{padding:0;border:1px solid var(--line);border-radius:2px;background:none;cursor:pointer;width:100%;aspect-ratio:1;overflow:hidden}
.up>button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.up img{display:block;width:100%;height:100%;object-fit:cover}
.up small{font-size:11px;color:var(--muted)}.up .link{font-size:12px;padding:0}
.prog{display:flex;justify-content:space-between;align-items:baseline}
.tofirst{font-size:12.5px;padding:0;letter-spacing:0}
.pacts{display:flex;gap:14px}
.item.cur{border-color:var(--ink)}
.item .meta b{font-weight:500;font-size:15px}

.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.filebtn:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.note.err{border-color:#9c1f1f;color:var(--ink);background:var(--surface);padding:8px 10px}
.opts.one{grid-template-columns:1fr}
#emsg{margin-top:12px}

.rng{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:6px 0 4px;font-size:14px}
.rng input{width:100%;accent-color:var(--ink)}
.rng output{font-size:13px;color:var(--muted);min-width:44px;text-align:end}
.mock.placing svg{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.mock.placing{user-select:none;-webkit-user-select:none}
</style>
</head>

function syncProject(){

  if(!S.p.id){if(S.step<2&&cur===(S.base||JSON.stringify(DEF)))return;const now=Date.now();S.p.id='w'+now.toString(36);S.p.c=now;}
  let it=S.items.find(x=>x.id===S.p.id);
  if(!it){it={id:S.p.id,n:S.items.reduce((m,x)=>Math.max(m,x.n||0),0)+1,c:S.p.c||Date.now()};S.items.push(it);}

}

}
const OKB={red:['bordeaux','heavy','burgundy','burgheavy','rhone'],white:['bordeaux','burgundy','burgheavy','rhone','alsace','provence'],rose:['provence','bordeaux','burgundy','rhone','alsace'],sparkling:['champagne'],orange:['bordeaux','burgundy','burgheavy','rhone','alsace'],dessert:['slim','alsace','bordeaux','port'],fortified:['port','slim','bordeaux','heavy']};
const OKG={red:['antique','dark','emerald','leaf','amber','black'],white:['flint','antique','emerald','leaf','amber','blue','dark'],rose:['flint','emerald'],sparkling:['dark','antique','emerald','flint','black'],orange:['flint','amber','antique','leaf'],dessert:['flint','amber','antique','leaf'],fortified:['dark','black','amber','antique']};
function BAN(k,v,p){
  const W=p.wine,B=D.bottle[p.bottle],wn='ליין '+nm('wine',W);
  if(k==='bottle')return OKB[W].includes(v)?'':v==='champagne'?'רק ליין מבעבע':W==='sparkling'?'לא עומד בלחץ':'לא מקובל '+wn;
  if(k==='glass')return OKG[W].includes(v)?'':W==='red'&&(v==='flint'||v==='blue')?'אור פוגע ביין אדום':W==='rose'?'מסתיר את צבע הרוזה':'לא מקובל '+wn;
  if(k==='closure'){const sp=v==='sparkling'||v==='crown';if(W==='sparkling')return sp?'':'לא עומד בלחץ';if(sp)return'רק ליין מבעבע';return W==='fortified'&&(v==='screw'||v==='glass')?'לא מקובל ליין מחוזק':'';}
  if(k==='cut'){if(v==='band'&&B.taper)return'הבקבוק צר במותן, תווית רחבה תתקמט';if(v==='strip'&&B.panel<110)return'אין מספיק גובה ישר בבקבוק';return'';}
  if(k==='division'){if(v==='side'&&['strip','circle','oval','shield','hexagon','arch'].includes(p.cut))return'אין מקום לצד הציור בצורה הזו';if(v==='medallion'&&p.cut==='strip')return'התווית צרה מדי';return'';}
  if(k==='paper')return v==='heavy'&&(ROUND.has(p.bottle)||B.taper)?'קשיח מדי לבקבוק מעוגל':'';
  if(k==='print')return v==='indigo'&&p.paper==='deep'?'לא נכנס לריקוע עמוק':'';
  if(k==='detail')return v==='fine'&&(p.print==='silk'||p.paper==='deep')?'פרטים קטנים לא יעברו':'';
  return'';
}
const CHAIN=[['bottle','צורת הבקבוק'],['glass','צבע הזכוכית'],['closure','סוג הפקק'],['cut','צורת התווית'],['division','חלוקת התווית'],['paper','הנייר'],['print','שיטת ההדפסה'],['detail','כמות הפרטים']];
function limits(p){const B=D.bottle[p.bottle];return{w:Math.min(Math.floor(Math.PI*B.d-10),(ROUND.has(p.bottle)||B.taper)?B.maxW:999),h:B.panel};}
function normalize(p){
  const ch=[];
  for(const[k,name]of CHAIN){if(BAN(k,p[k],p)){p[k]=(k==='bottle'?OKB[p.wine]:k==='glass'?OKG[p.wine]:Object.keys(D[k])).find(v=>!BAN(k,v,p));ch.push(name);if(k==='bottle'||k==='cut'){[p.w,p.h]=recDims(p);p.typeH=recType(p);}if(k==='division')p.typeH=recType(p);}}
  const L=limits(p);if(p.w>L.w)p.w=L.w;if(p.h>L.h)p.h=L.h;
  for(let i=0;i<40&&geo(p).tight;i++){if(p.typeH>12)p.typeH-=2;else if(p.margin>0)p.margin--;else break;}
  return ch;
}
function recDims(p){
  const [bw,bh]=D.bottle[p.bottle].base,pn=D.bottle[p.bottle].panel;
  const m={rect:[1,1],square:[0,0],circle:[0,0],arch:[.9,1],oval:[.86,.96],strip:[.55,1.22],band:[1.25,.6],shield:[.9,1],octagon:[1,1],hexagon:[.88,1.05]}[p.cut];
  let w=bw*m[0],h=bh*m[1];
  if(p.cut==='square'||p.cut==='circle'){w=h=Math.min(bw,bh)*.82;}
  if(p.cut==='strip')h=Math.min(h,pn-8);
  return[Math.round(w),Math.round(h)];
}
function recType(p){return Math.round(p.h*({top:.27,full:.24,window:.26,medallion:.28,side:.27,minimal:.32}[p.division]));}
function setParam(k,v){
  const p=S.p;p[k]=v;if(k==='painting'){p.pz=1;p.px=0;p.py=0;p.paintAR=0;if(v)setAR(p);}S.shot=false;S.photo='';if(k[0]==='s')applyStory(p);
  if(k==='bottle'||k==='cut'){[p.w,p.h]=recDims(p);p.typeH=recType(p);}
  if(k==='division')p.typeH=recType(p);

/* ═════════ 4. Geometry, rules, calculator ═════════ */
const r1=n=>Math.round(n*10)/10;
function geo(p){
  const B=D.bottle[p.bottle],r=B.d/2,circ=Math.PI*B.d,{w,h}=p,m=p.margin,tH=p.typeH,rH=p.regH;
  const R=p.labeler==='auto'?1.5:0,bp=h*({shield:.14,hexagon:.17,circle:.1,oval:.06}[p.cut]||0),ib=h-m-rH-bp;
  let art,type;
  if(p.division==='full'){art={x:m,y:m,w:w-2*m,h:ib-m};type={x:m+2,y:ib-tH,w:w-2*m-4,h:tH-2,over:true};}
  else if(p.division==='window'){const i=m+6;art={x:i,y:i,w:w-2*i,h:ib-tH-i};type={x:m,y:ib-tH,w:w-2*m,h:tH};}
  else if(p.division==='medallion'){const dia=Math.min(w-2*m-12,ib-tH-m-6);art={x:(w-dia)/2,y:m+4,w:dia,h:dia,round:true};type={x:m,y:ib-tH,w:w-2*m,h:tH};}
  else if(p.division==='side'){const aw=(w-2*m)*.5;art={x:m,y:m,w:aw,h:ib-m};type={x:m+aw+2,y:m,w:w-2*m-aw-2,h:ib-m};}
  else if(p.division==='minimal'){const aw=(w-2*m)*.46,ah=Math.min(aw*1.2,ib-tH-m-8);art={x:(w-aw)/2,y:m+8,w:aw,h:ah};type={x:m,y:ib-tH,w:w-2*m,h:tH};}
  else{art={x:m,y:m,w:w-2*m,h:ib-tH-m};type={x:m,y:ib-tH,w:w-2*m,h:tH};}
  const tight=art.w<20||art.h<20;art.w=Math.max(art.w,4);art.h=Math.max(art.h,4);
  const th=w/r,apparent=th<Math.PI?2*r*Math.sin(th/2):B.d;
  const k=p.canvas*10/Math.max(art.w,art.h),bl=2;
  return{B,r,circ,R,art,type,reg:{x:m,y:h-m-rH-bp,w:w-2*m,h:rH},tight,apparent,deg:th*180/Math.PI,k,bl,
    cw:art.w*k/10,ch:art.h*k/10,cbw:(art.w+2*bl)*k/10,cbh:(art.h+2*bl)*k/10,
    px:[Math.ceil((art.w+2*bl)/25.4*600),Math.ceil((art.h+2*bl)/25.4*600)],scan:Math.max(150,Math.ceil(600/k/50)*50)};
}
function rules(p){
  const g=geo(p),B=g.B,o=[],add=(s,lv,t,x,fix,fl)=>o.push({s,lv,t,x,fix,fl});
  if(p.wine==='sparkling'&&!['sparkling','crown'].includes(p.closure))add(1,'bad','פקק לא מתאים ליין מבעבע','הלחץ בבקבוק דורש פקק פטרייה עם כלוב תיל, או פקק כתר.',{closure:'sparkling'},'החלף לפקק פטרייה וכלוב');
  if(p.wine==='sparkling'&&p.bottle!=='champagne')add(1,'bad','הבקבוק לא עומד בלחץ','יין מבעבע ממלאים רק בבקבוק שמפניה עבה.',{bottle:'champagne'},'החלף לבקבוק שמפניה');
  if(p.w>g.circ-10)add(3,'bad','התווית רחבה מהיקף הבקבוק',`היקף הבקבוק ${r1(g.circ)} מ״מ, ונדרש רווח של 10 מ״מ לפחות.`,{w:Math.floor(g.circ-10)},'הקטן את הרוחב');
  if(p.h>B.panel)add(3,'warn','התווית גבוהה מהדופן הישרה',`גובה ${p.h} מ״מ מול דופן ישרה של ${B.panel} מ״מ. מעליה הנייר מתקמט בכתף.`,{h:B.panel-4},`קצר ל־${B.panel-4} מ״מ`);
  if(ROUND.has(p.bottle)&&p.w>B.maxW)add(3,'warn','תווית רחבה על בקבוק מעוגל כתפיים',`בבקבוק הזה תווית רחבה מ־${B.maxW} מ״מ נוטה להתקמט בהדבקה.`,{w:B.maxW},`הצר ל־${B.maxW} מ״מ`);
  add(3,'info',p.labeler==='auto'?'פינות מעוגלות R=1.5 מ״מ':'פינות חדות',p.labeler==='auto'?'נדרש למכונת הדבקה מגליל. הרחיקו פרטים חשובים בציור מהפינות.':'חיתוך חד מתאים להדבקה ידנית בלבד.');
  if(g.tight)add(4,'warn','שטח הציור קטן מדי',`נשארו לציור ${r1(g.art.w)} × ${r1(g.art.h)} מ״מ. הקטינו את רצועת האותיות או את מסגרת הנייר.`,{typeH:Math.max(12,p.typeH-8),margin:Math.max(0,p.margin-2)},'פנה מקום לציור');

  if(p.print==='indigo'&&p.paper==='deep')add(5,'warn','דיגיטלי על ריקוע עמוק','הדיו לא נכנס לשקעים העמוקים והציור מאבד חדות.',{paper:'felt'},'החלף לריקוע עדין');
  if(p.print==='silk')add(5,'info','דפוס משי','מתאים לכתמי צבע ברורים. פרטים זעירים לא יעברו.');

  if(p.print==='silk'&&(p.subject==='hand'||p.detail==='fine'))add(6,'warn','נושא עתיר פרטים בדפוס משי','ציור עשיר בפרטים לא עובר בדפוס משי. ציירו בכתמים רחבים או בחרו שיטת דפוס אחרת.',{print:'tbd'},'השאר את שיטת הדפוס פתוחה');

  if(p.print==='cmyk'&&p.thread!=='none')add(7,'warn','האדום של החוט יתעמם ב־CMYK','אדום עז מאבד רוויה בהמרה לארבעה צבעים. חובה לאשר Proof צבע.',{print:'pantone'},'הוסף צבע פנטון לחוט');

  return o;
}
function autoFix(p){normalize(p);for(let i=0;i<6;i++){const f=rules(p).find(x=>x.fix&&(x.lv==='bad'||x.lv==='warn'));if(!f)break;Object.assign(p,f.fix);}return p;}

function closure(t,col,cx,yT,nd,u,glass){

  if(t==='glass')return lip+`<rect x="${cx-nd*.6}" y="${yT-u*.2}" width="${nd*1.2}" height="${u*.26}" rx="${u*.09}" fill="#dfe8e6" stroke="#8fa19e" stroke-width="${u*.03}"/>`;

function shapeD(cut,x,y,w,h,R){

function vBuild(){
  const p=S.p,n=S.step,all=rules(p).map((x,i)=>Object.assign(x,{i}));

      if(G.stp){h+=`<div class="grp"><div class="stp"><h3>${G.t}${q}</h3><div class="ctl"><button data-action="inc" data-k="${G.stp}" data-d="-1" data-min="${G.min}" data-max="${G.max}" id="dec-${G.stp}" aria-label="${G.t}: פחות מילימטר">−</button><output id="o-${G.stp}">${p[G.stp]} ${G.u}</output><button data-action="inc" data-k="${G.stp}" data-d="1" data-min="${G.min}" data-max="${G.max}" id="inc-${G.stp}" aria-label="${G.t}: עוד מילימטר">+</button></div></div></div>`;continue;}
      if(G.txt){h+=`<div class="grp ${G.two?'two':''}">${G.txt.map(t=>`<div class="fld"><label for="t-${t[0]}">${t[1]}</label><input id="t-${t[0]}" data-k="${t[0]}" value="${esc(p[t[0]])}" placeholder="${esc(t[2]||'')}" autocomplete="off"></div>`).join('')}</div>`;continue;}
      if(CHIPS.has(G.k)){h+=`<div class="grp"><h3>${G.t}${q}</h3><div class="opts">${G.o.map(o=>{const on=G.multi?p[G.k].includes(o[0]):String(p[G.k])===String(o[0]),ban=BAN(G.k,o[0],p);
        return`<button class="opt" id="c-${G.k}-${o[0]}" data-action="${G.multi?'toggle':'pick'}" data-k="${G.k}" data-v="${o[0]}" aria-pressed="${on}" ${ban?'disabled':''}>${ico(G.k,o[0],p)}<span>${esc(o[1])}${ban?`<span class="why">${esc(ban)}</span>`:''}</span></button>`}).join('')}</div></div>`;continue;}
      h+=`<div class="grp"><h3>${G.t}${q}</h3><div class="cards">${G.o.map(o=>card(o,G.multi?p[G.k].includes(o[0]):String(p[G.k])===String(o[0]),G.multi?'toggle':'pick',{id:G.k+'-'+o[0],attrs:`data-k="${G.k}" data-v="${o[0]}"`,ban:BAN(G.k,o[0],p)})).join('')}</div></div>`;
    }

function insights(p){

  const prem=['gift','collector','party'].includes(p.moment),loud=['side','full'].includes(p.division)&&p.thread==='bold';
  if(p.moment==='gift')out.push(['כשקונים יין במתנה, התווית קובעת יותר מבכל קנייה אחרת.',[5]]);
  if(prem&&loud)out.push(['ליין יוקרתי, תווית רועשת מדי מורידה את תחושת האיכות ואת המחיר שמוכנים לשלם. שווה לבחון גם גרסה שקטה יותר.',[6]]);
  else if(prem)out.push(['סימני יוקרה קלאסיים, כמו כהה, זהב ואותיות חזקות, מעלים את הציפייה למחיר ולאיכות.',[4]]);
  if(p.wine!=='red'&&['chiaroscuro','candle'].includes(p.light))out.push([`קונים מעדיפים תווית שתואמת את מה שהם מצפים מהיין. ציור כהה וכבד על יין ${nm('wine',p.wine)} עלול להבטיח יין אחר.`,[7]]);
  return out;
}

  copybrief:()=>copy(briefMd(S.p),'הבריף הועתק.'),
  share:()=>shareResult(),sharebrief:()=>shareBrief(),
  dlbrief:()=>dl('label-brief.md',briefMd(S.p)),
  dlsvg:()=>dl('label-studio.svg',scene(S.p,8,'x').replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ').replace(/var\(--display\)/g,'serif').replace(/var\(--body\)/g,'sans-serif').replace(/var\(--mono\)/g,'monospace')),
  copyprompt:()=>copy(photoPrompt(S.p),'התיאור הועתק.'),
  newver:()=>{syncProject();const now=Date.now(),p=clone(S.p);p.id='w'+now.toString(36);p.c=now;S.items.push({id:p.id,n:S.items.reduce((m,x)=>Math.max(m,x.n||0),0)+1,c:now,t:now,step:S.step,p:clone(p)});S.p=p;persist();render();say('נשמרה גרסה חדשה בפרויקטים, והיא הפתוחה עכשיו.');},
  realshot:()=>realShot(),engine:()=>openEngine(),clearphoto:()=>{S.photo='';render();},
  emodel:e=>{const x=engine();x.model=e.dataset.m;saveEngine(x);openEngine('המודל נבחר.',true);},
  etest:async()=>{const key=$('ekey').value.trim();if(!key){openEngine('הדביקו מפתח קודם.');return;}
    const x=Object.assign(engine(),{key});saveEngine(x);$('emsg').innerHTML='<p class="note">בודק את החיבור…</p>';
    try{const d=await discover(x);openEngine('החיבור תקין. נמצאו '+d.models.length+' מודלים ליצירת תמונות, ונבחר '+d.models.find(m=>m.id===d.model).label+'.',true);}
    catch(err){openEngine(err instanceof TypeError?NONET:err.message);}
    if(S.view==='home')render(true);},
  eclear:()=>{try{localStorage.removeItem(KE);}catch(x){}$('layer').innerHTML='';render();},
  dlphoto:async()=>{const b=await (await fetch(S.photo)).blob(),n='wine-label-photo.'+(b.type.includes('jpeg')?'jpg':'png');if(S.caps.downloads)return dl(n,b);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();},
  rmpaint:()=>{setParam('painting','');render();},
  pzreset:()=>{Object.assign(S.p,{pz:1,px:0,py:0});S.photo='';persist();render(true);},
  useupload:e=>{const u=S.uploads.find(x=>x.id===e.dataset.id);if(u){S.p.own='upload';if(S.p.painting!==u.data)setParam('painting',u.data);if(S.view==='saved'){S.step=6;nav('build');}else render(true);}},
  delupload:e=>{if(S.delId===e.dataset.id){S.uploads=S.uploads.filter(x=>x.id!==S.delId);tx('uploads','readwrite',s=>s.delete(e.dataset.id));S.delId=null;}else S.delId=e.dataset.id;render(true);},
  pickstory:e=>{setParam('sPick',+e.dataset.i);render(true);},
  edit:e=>{const it=S.items.find(x=>x.id===e.dataset.id);if(it){if(S.p.id!==it.id)syncProject();S.p=fixp(Object.assign(clone(DEF),clone(it.p)));S.step=it.step||8;S.started=true;S.shot=S.step===8;S.photo='';S.tab='shot';S.note='';nav('build');}},
  dup:e=>{const it=S.items.find(x=>x.id===e.dataset.id);if(it){const now=Date.now(),p=clone(it.p);p.id='w'+now.toString(36);p.c=now;S.items.push({id:p.id,n:S.items.reduce((m,x)=>Math.max(m,x.n||0),0)+1,c:now,t:now,step:it.step||8,p});persist();render();}},
  del:e=>{if(S.delId===e.dataset.id){S.items=S.items.filter(x=>x.id!==S.delId);if(S.p.id===S.delId){S.p=clone(DEF);S.step=1;S.started=false;S.shot=false;S.photo='';}S.delId=null;persist();}else S.delId=e.dataset.id;render(true);}
};
/* ── durable store on this device: every uploaded file (original kept) and every finished label ── */
let _db;
function odb(){return _db||(_db=new Promise((res,rej)=>{try{const r=indexedDB.open('wine-label-studio',1);r.onupgradeneeded=()=>{r.result.createObjectStore('uploads',{keyPath:'id'});r.result.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}}));}
const tx=(st,mode,fn)=>odb().then(d=>new Promise((res,rej)=>{const t=d.transaction(st,mode),rq=fn(t.objectStore(st));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);})).catch(()=>null);
S.uploads=[];
async function loadStore(){
  const it=await tx('kv','readonly',s=>s.get('items'));
  if(Array.isArray(it)&&it.length){const have=new Set(it.map(x=>x.id));S.items=it.concat(S.items.filter(x=>!have.has(x.id))).map(x=>(x.p=fixp(Object.assign(clone(DEF),x.p)),x));}
  const up=await tx('uploads','readonly',s=>s.getAll());S.uploads=(up||[]).sort((a,b)=>b.t-a.t);
  S.storeOk=it!==null||up!==null;
}
function saveItem(){
  syncProject();persist();
}
function shrink(img,max,q){const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);}
function onUpload(file){S.p.own='upload';S.note='טוען את הציור…';render(true);
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const data=shrink(img,720,.82),rec={id:'u'+Date.now().toString(36),t:Date.now(),name:file.name||'צילום',data,thumb:shrink(img,160,.7),blob:file};URL.revokeObjectURL(url);
    S.uploads.unshift(rec);tx('uploads','readwrite',s=>s.put(rec));setParam('painting',data);S.note='הציור נטען ומשובץ בתווית.';render(true);};
  img.onerror=()=>{URL.revokeObjectURL(url);S.note='לא הצלחנו לפתוח את הקובץ. נסו צילום בפורמט JPG או PNG.';render(true);};img.src=url;
}
function uploadsHtml(pick){
  if(!S.uploads.length)return'';
  return`<div class="ups">${S.uploads.map(u=>`<div class="up"><button data-action="useupload" data-id="${u.id}" aria-label="להשתמש בציור ${esc(u.name)}" aria-pressed="${S.p.painting===u.data}"><img src="${u.thumb}" alt=""></button>${pick?'':`<small class="num">${new Date(u.t).toLocaleDateString('he-IL')}</small><button class="link" data-action="delupload" data-id="${u.id}">${S.delId===u.id?'בטוח?':'מחק'}</button>`}</div>`).join('')}</div>`;
}
function start(){
  try{if(localStorage.getItem('wl-ver')!=='3'){['wl-draft-v2','wl-items-v2','label-atelier-v1'].forEach(k=>localStorage.removeItem(k));indexedDB.deleteDatabase('wine-label-studio');localStorage.setItem('wl-ver','3');}}catch(e){}
  restore();
  const h=location.hash.slice(1);if(['home','build','saved'].includes(h))S.view=h;
  document.addEventListener('click',ev=>{const e=ev.target.closest('[data-action]');if(!e||e.disabled)return;const f=ACT[e.dataset.action];if(f){try{f(e,ev);}catch(err){console.error(err);}}});
  document.addEventListener('input',ev=>{const e=ev.target;if(e.dataset&&e.dataset.pz){S.p[e.dataset.pz]=+e.value;S.photo='';const o=$('pz-o');if(o)o.textContent='×'+(+e.value).toFixed(2);refreshMock();persist();return;}
    if(e.dataset&&e.dataset.k&&(e.tagName==='INPUT'||e.tagName==='TEXTAREA')&&e.type!=='file'){S.p[e.dataset.k]=e.value;if(e.dataset.k==='sUnique'){applyStory(S.p);[0,1,2].forEach(i=>{const t=$('st-t-'+i);if(t)t.textContent=storyText(S.p,i);});}S.shot=false;S.started=true;persist();refreshMock();}});
  document.addEventListener('change',ev=>{if((ev.target.id==='up'||ev.target.id==='cam')&&ev.target.files&&ev.target.files[0]){const f=ev.target.files[0];ev.target.value='';onUpload(f);}});
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape')$('layer').innerHTML='';});
  window.addEventListener('hashchange',()=>{if(S.skip){S.skip=false;return;}const v=location.hash.slice(1);if(['home','build','saved'].includes(v)&&v!==S.view){S.view=v;render();}});
  render();
  let drag=null;
  document.addEventListener('pointerdown',ev=>{
    const mk=ev.target.closest&&ev.target.closest('#mock');if(!mk||S.view!=='build'||S.step!==6||!S.p.painting)return;const im=mk.querySelector('image[data-paint]');if(!im)return;
    const m=im.getScreenCTM();if(!m)return;const inv=m.inverse(),pt=new DOMPoint(ev.clientX,ev.clientY).matrixTransform(inv),a=geo(S.p).art,b=paintBox(S.p,a);
    drag={im,inv,sx:pt.x,sy:pt.y,bx:b.x,by:b.y,a,b,id:ev.pointerId};ev.preventDefault();try{im.setPointerCapture(ev.pointerId);}catch(e){}
  });
  document.addEventListener('pointermove',ev=>{
    if(!drag||ev.pointerId!==drag.id)return;const pt=new DOMPoint(ev.clientX,ev.clientY).matrixTransform(drag.inv),{a,b}=drag,cl=v=>Math.max(-1,Math.min(1,v));
    if(b.ox>0)S.p.px=cl(1-2*(a.x-(drag.bx+pt.x-drag.sx))/b.ox);
    if(b.oy>0)S.p.py=cl(1-2*(a.y-(drag.by+pt.y-drag.sy))/b.oy);
    const nb=paintBox(S.p,a);drag.im.setAttribute('x',nb.x);drag.im.setAttribute('y',nb.y);
  });
  const endDrag=ev=>{if(!drag||ev.pointerId!==drag.id)return;drag=null;S.photo='';persist();refreshMock();};
  document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
  loadStore().then(()=>render(true));
  if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{if(d){S.caps.downloads=d;render(true);}}).catch(()=>{});
}
document.addEventListener('DOMContentLoaded',()=>{
  try{start();}catch(err){console.error(err);$('view').innerHTML='<h2>משהו השתבש בטעינה</h2><p class="lead">רעננו את העמוד. אם זה חוזר, נקו את נתוני האתר ונסו שוב.</p>';}
});
</script>
