name: בדיקות
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: בדיקת טיפוסים
        run: npm run typecheck
      - name: הרשאות ומעברים במסד
        run: npm run test:db
      - name: תמחור ומצבים, מול הדפדפן ומול המסד
        run: npm test
      - name: תחביר קובצי האתר
        run: for f in Portal/*.js netlify/edge-functions/*.js; do node --check "$f" || exit 1; done
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: דפדפן מדומה
        run: pip install playwright pypdf && python -m playwright install --with-deps chromium
      - name: בדיקות דפדפן לכל הסבבים
        run: python tests/e2e/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: tests/e2e/out, if-no-files-found: ignore }
